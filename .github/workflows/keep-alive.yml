name: Keep Render Services Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API + Bot
        run: |
          set -e
          echo "Timestamp: $(date -u)"

          ping_one() {
            name="$1"
            url="$2"
            echo "---- $name ----"
            echo "URL: $url"
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" -m 45 "$url" || echo "000")
            echo "HTTP $code"
            echo "Body: $(head -c 200 /tmp/body.txt 2>/dev/null || true)"
            if [ "$code" != "200" ]; then
              echo "FAIL: $name"
              return 1
            fi
            echo "OK: $name"
            return 0
          }

          fail=0
          ping_one "API" "https://fortune-teller-nhy4.onrender.com/keepitawake" || fail=1
          # Bot web service root (health / main.py returns 200 on GET /)
          ping_one "BOT" "https://fortune-teller-1.onrender.com/" || fail=1

          if [ "$fail" -ne 0 ]; then
            echo "One or more pings failed"
            exit 1
          fi
          echo "All services responded 200"
