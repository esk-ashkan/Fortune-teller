name: Keep Render Service Alive (Enhanced)

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-service:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Render Service with Detailed Logging
        id: ping
        run: |
          echo "⏰ Timestamp: $(date)"
          echo "📡 Pinging: https://fortune-teller-nhy4.onrender.com/keepitawake"
          
          # Get HTTP status code and response time
          start_time=$(date +%s%N)
          response_code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
            https://fortune-teller-nhy4.onrender.com/keepitawake)
          end_time=$(date +%s%N)
          
          duration=$(( (end_time - start_time) / 1000000000 ))
          
          echo "status_code=$response_code" >> $GITHUB_OUTPUT
          echo "duration=$duration" >> $GITHUB_OUTPUT
          
          echo "📊 Response: HTTP $response_code (${duration}s)"
          
          if [ "$response_code" = "200" ]; then
            echo "✅ Service is awake and responsive"
          else
            echo "⚠️ Service returned non-200 status: $response_code"
          fi
          
          # Store response for email notification
          echo "response=$response_code" >> $GITHUB_OUTPUT
      
      - name: Send Failure Alert (Optional)
        if: steps.ping.outputs.status_code != '200'
        run: |
          echo "🚨 WARNING: Service is not responding correctly!"
          echo "Status code: ${{ steps.ping.outputs.status_code }}"
          echo "Response time: ${{ steps.ping.outputs.duration }}s"
          
          # Example: Send to Slack (if you want to set up notifications)
          # curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"text\":\"🚨 Render service is down! Status: ${{ steps.ping.outputs.status_code }}\"}" \
          #   ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Log Success
        if: steps.ping.outputs.status_code == '200'
        run: |
          echo "✅ Service is awake at $(date)"
          echo "   Status: HTTP ${{ steps.ping.outputs.status_code }}"
          echo "   Response time: ${{ steps.ping.outputs.duration }}s"