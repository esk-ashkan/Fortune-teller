name: Keep Render Service Alive

on:
  schedule:
    # Every 5 minutes (UTC)
    - cron: "*/5 * * * *"
  workflow_dispatch: # manual run from Actions tab

jobs:
  ping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        id: ping
        run: |
          echo "Timestamp: $(date -u)"
          URL="https://fortune-teller-nhy4.onrender.com/keepitawake"

          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" -m 45 "$URL" || echo "000")
          echo "HTTP $code"
          echo "Body: $(head -c 200 /tmp/body.txt 2>/dev/null || true)"

          echo "status_code=$code" >> "$GITHUB_OUTPUT"

          if [ "$code" = "200" ]; then
            echo "Service awake"
            exit 0
          fi

          echo "Non-200 response"
          exit 1

      - name: On failure
        if: failure()
        run: |
          echo "Ping failed — check Render logs / cold start"
